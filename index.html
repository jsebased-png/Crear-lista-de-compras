<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Listas y Tabla</title>
    <style>
        body {
            font-family: monospace;
            background-color: #f9f9f9;
            padding: 20px;
        }
        h2 {
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
        }
        .verdura {
            border-bottom: 2px dashed green;
            padding: 5px;
            font-weight: bold;
        }
        .fruta {
            border-bottom: 2px dotted yellow;
            padding: 5px;
            font-weight: bold;
        }
        table {
            width: 60%;
            margin: 20px auto;
            border-collapse: collapse;
            text-align: center;
        }
        th,
        td {
            border: 1px solid #333;
            padding: 10px;
        }
        th {
            background-color: #eee;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>Listas para Verduras y Frutas</h2>
    <ul>
        <li class="verdura">Romanesco</li>
        <li class="verdura">Lechuga</li>
        <li class="verdura">Espinaca</li>
        <li class="verdura">Ibias</li>
        <li class="verdura">Guascas </li>
    </ul>
    <ul>
        <li class="fruta">Borojó </li>
        <li class="fruta">Banana</li>
        <li class="fruta">Naranja</li>
        <li class="fruta">Uva</li>
        <li class="fruta">Mango</li>
    </ul>







































































































    <table>
        <tr>
            <th>Frutas</th>
            <td>5</td>
        </tr>
        <tr>
            <th>Verduras</th>
            <td>5</td>
        </tr>
        <tr>
            <th>Total</th>
            <td>10</td>
        </tr>
    </table>
</body>

</html>
